name: Copy Docker Image new
run-name: Copy ${{ inputs.source_repo }} to ${{ inputs.destination_repo }}

on: 
  workflow_dispatch:
    inputs:
      source:
        description: '镜像源 (Registry)'     
        required: true
        default: 'docker.io'
      destination:
        description: '目标源 (Registry)'
        required: true
        default: 'registry.cn-shanghai.aliyuncs.com'
      source_repo:
        description: '仓库及标签 (格式 repo:tag)'
        required: true
        default: ''
      destination_repo:
        description: '目标仓库及标签 (格式 repo:tag)'
        required: true
        default: ''

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - name: Free Disk Space
        run: |
          echo "Cleaning up unnecessary software to free up space..."
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Login and Copy Docker Image
        run: |
          # 1. 登录源镜像仓库（如果配置了 SOURCE_CREDENTIAL）
          if [ -n "${{ secrets.SOURCE_CREDENTIAL }}" ]; then
            echo "${{ secrets.SOURCE_CREDENTIAL }}" | skopeo login --username "$(echo '${{ secrets.SOURCE_CREDENTIAL }}' | cut -d: -f1)" --password-stdin ${{ github.event.inputs.source }}
          fi

          # 2. 登录目标镜像仓库（阿里云）
          if [ -n "${{ secrets.DESTINATION_CREDENTIAL }}" ]; then
            echo "${{ secrets.DESTINATION_CREDENTIAL }}" | skopeo login --username "$(echo '${{ secrets.DESTINATION_CREDENTIAL }}' | cut -d: -f1)" --password-stdin ${{ github.event.inputs.destination }}
          fi

          # 3. 使用 --format docker 参数强制转换为 Docker 格式，彻底解决阿里云不兼容 OCI 空清单的问题
          skopeo copy --format docker --all \
            docker://${{ github.event.inputs.source }}/${{ github.event.inputs.source_repo }} \
            docker://${{ github.event.inputs.destination }}/${{ github.event.inputs.destination_repo }}
