name: Copy Docker Image new
run-name: Copy ${{ inputs.source_repo }} to ${{ inputs.destination_repo }}

on: 
  workflow_dispatch:
    inputs:
      source:
        description: '镜像源 (Registry)'     
        required: true
        default: 'docker.io'
      destination:
        description: '目标源 (Registry)'
        required: true
        default: 'registry.cn-shanghai.aliyuncs.com'
      source_repo:
        description: '仓库及标签 (格式 repo:tag)'
        required: true
        default: ''
      destination_repo:
        description: '目标仓库及标签 (格式 repo:tag)'
        required: true
        default: ''

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - name: Free Disk Space
        run: |
          echo "Cleaning up unnecessary software to free up space..."
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Login and Copy Docker Image
        env:
          SRC_REG: ${{ github.event.inputs.source }}
          SRC_REPO: ${{ github.event.inputs.source_repo }}
          SRC_CRED: ${{ secrets.SOURCE_CREDENTIAL }}
          DEST_REG: ${{ github.event.inputs.destination }}
          DEST_REPO: ${{ github.event.inputs.destination_repo }}
          DEST_CRED: ${{ secrets.DESTINATION_CREDENTIAL }}
        run: |
          # 1. 登录目标仓库 (阿里云) - 严格按照 username:password 格式截取
          if [ -n "$DEST_CRED" ]; then
            DEST_USER="${DEST_CRED%%:*}"
            DEST_PASS="${DEST_CRED#*:}"
            skopeo login -u "$DEST_USER" -p "$DEST_PASS" "$DEST_REG"
          fi

          # 2. 登录源仓库 (如果配置了凭证)
          if [ -n "$SRC_CRED" ]; then
            SRC_USER="${SRC_CRED%%:*}"
            SRC_PASS="${SRC_CRED#*:}"
            skopeo login -u "$SRC_USER" -p "$SRC_PASS" "$SRC_REG"
          fi

          # 3. 核心修复：
          # 去掉 --all，指定 amd64 架构，直接绕过引起阿里云报错的 OCI 空清单 (Attestation)
          skopeo copy --override-os linux --override-arch amd64 \
            "docker://${SRC_REG}/${SRC_REPO}" \
            "docker://${DEST_REG}/${DEST_REPO}"
