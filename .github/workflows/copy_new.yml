name: Copy Docker Image new
run-name: Copy ${{ inputs.source_repo }} to ${{ inputs.destination_repo }}

on: 
  workflow_dispatch:
    inputs:
      source:
        description: '镜像源 (Registry)'     
        required: true
        default: 'docker.io'
      destination:
        description: '目标源 (Registry)'
        required: true
        default: 'registry.cn-shanghai.aliyuncs.com'
      source_repo:
        description: '仓库及标签 (格式 repo:tag)'
        required: true
        default: ''
      destination_repo:
        description: '目标仓库及标签 (格式 repo:tag)'
        required: true
        default: ''

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - name: Free Disk Space
        run: |
          echo "Cleaning up unnecessary software to free up space..."
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Login and Copy Docker Image
        run: |
          # 解析并登录目标镜像仓库（适配 用户名:密码 或纯密码格式）
          if [ -n "${{ secrets.DESTINATION_CREDENTIAL }}" ]; then
            if echo "${{ secrets.DESTINATION_CREDENTIAL }}" | grep -q ':'; then
              IFS=':' read -r dest_user dest_pass <<< "${{ secrets.DESTINATION_CREDENTIAL }}"
              echo "$dest_pass" | skopeo login --username "$dest_user" --password-stdin ${{ github.event.inputs.destination }}
            else
              # 如果你的 SECRET 里面只有密码，请将下面的 "你的阿里云账号名" 替换为实际的账号名
              echo "${{ secrets.DESTINATION_CREDENTIAL }}" | skopeo login --username "你的阿里云账号名" --password-stdin ${{ github.event.inputs.destination }}
            fi
          fi

          # 核心修复：通过 --format docker 过滤掉阿里云不支持的 OCI 空清单格式
          skopeo copy --format docker --all \
            docker://${{ github.event.inputs.source }}/${{ github.event.inputs.source_repo }} \
            docker://${{ github.event.inputs.destination }}/${{ github.event.inputs.destination_repo }}
